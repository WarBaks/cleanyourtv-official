plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.udeshvirk.cricket'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.udeshvirk.cricket'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Test only (never in the APK): the JSON parser Android ships, for plain JVM tests of the feed parsing.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
